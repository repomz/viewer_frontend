name: Publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  GHCR_IMAGE: ghcr.io/repomz/viewer_frontend
  DOCKERHUB_IMAGE: idrisovmarat/viewer_frontend
  DEFAULT_OHIF_URL: http://135.106.130.37:3000

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME || 'idrisovmarat' }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Generate GHCR image metadata
        id: ghcr-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push to GHCR
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.ghcr-meta.outputs.tags }}
          labels: ${{ steps.ghcr-meta.outputs.labels }}
          build-args: |
            EXPO_PUBLIC_OHIF_URL=${{ vars.EXPO_PUBLIC_OHIF_URL || env.DEFAULT_OHIF_URL }}
            VERSION=${{ steps.ghcr-meta.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Generate Docker Hub image metadata
        if: ${{ env.DOCKERHUB_TOKEN != '' }}
        id: dockerhub-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Mirror image to Docker Hub
        if: ${{ env.DOCKERHUB_TOKEN != '' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.dockerhub-meta.outputs.tags }}
          labels: ${{ steps.dockerhub-meta.outputs.labels }}
          build-args: |
            EXPO_PUBLIC_OHIF_URL=${{ vars.EXPO_PUBLIC_OHIF_URL || env.DEFAULT_OHIF_URL }}
            VERSION=${{ steps.dockerhub-meta.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          provenance: true

      - name: Docker Hub publication status
        if: ${{ env.DOCKERHUB_TOKEN == '' }}
        run: |
          echo "::notice title=Docker Hub mirror skipped::Add the DOCKERHUB_TOKEN repository secret to enable idrisovmarat/viewer_frontend publishing. The image was published to GHCR."
